<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Myntra Login</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      background:#f5f5f6;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    .login-container{
      background:white;
      width:350px;
      padding:30px;
      border-radius:10px;
      box-shadow:0 4px 10px rgba(0,0,0,0.1);
    }

    .logo{
      text-align:center;
      color:#ff3f6c;
      font-size:32px;
      font-weight:bold;
      margin-bottom:20px;
    }

    .input-box{
      width:100%;
      padding:12px;
      margin:10px 0;
      border:1px solid #ccc;
      border-radius:5px;
      font-size:16px;
    }

    .login-btn{
      width:100%;
      padding:12px;
      background:#ff3f6c;
      color:white;
      border:none;
      border-radius:5px;
      font-size:18px;
      cursor:pointer;
      margin-top:10px;
    }

    .login-btn:hover{
      background:#e7335d;
    }

    .demo{
      margin-top:15px;
      text-align:center;
      color:gray;
      font-size:14px;
    }

    .error{
      color:red;
      text-align:center;
      margin-top:10px;
    }

    .success{
      color:green;
      text-align:center;
      margin-top:10px;
    }
  </style>
</head>

<body>

  <div class="login-container">

    <div class="logo">
      Myntra
    </div>

    <form id="loginForm">

      <input
        type="email"
        id="email"
        class="input-box"
        placeholder="Enter Email"
        required
      />

      <input
        type="password"
        id="password"
        class="input-box"
        placeholder="Enter Password"
        required
      />

      <button type="submit" class="login-btn">
        Login
      </button>

      <div class="demo">
        Demo Email: admin@gmail.com <br>
        Password: 123456
      </div>

      <p id="message"></p>

    </form>

  </div>

  <script>

    const loginForm = document.getElementById("loginForm");

    loginForm.addEventListener("submit", function(e){

      e.preventDefault();

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      const message = document.getElementById("message");

      if(email === "admin@gmail.com" && password === "123456"){

        localStorage.setItem("userEmail", email);

        message.className = "success";
        message.innerText = "Login Successful";

        setTimeout(() => {
          window.location.href = "index.html";
        }, 1000);

      }
      else{

        message.className = "error";
        message.innerText = "Invalid Email or Password";

      }

    });

  </script>

</body>
</html>
